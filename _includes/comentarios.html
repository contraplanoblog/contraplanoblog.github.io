{% if site.giscus.repo_id and site.giscus.repo_id != "" and site.giscus.category_id != "" %}
<section class="coments" aria-labelledby="h-com">
  <div class="dots" aria-hidden="true"></div>
  <h2 id="h-com">Comentários</h2>
  <p class="com-note">Para comentar, entre com uma conta do GitHub.</p>
  <script src="https://giscus.app/client.js"
    data-repo="{{ site.giscus.repo }}" data-repo-id="{{ site.giscus.repo_id }}"
    data-category="{{ site.giscus.category }}" data-category-id="{{ site.giscus.category_id }}"
    data-mapping="pathname" data-strict="1" data-reactions-enabled="1" data-emit-metadata="0"
    data-input-position="top" data-theme="light" data-lang="pt" data-loading="lazy"
    crossorigin="anonymous" async></script>
</section>
{% endif %}
